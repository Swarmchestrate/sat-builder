name: Build and Deploy SAT Builder

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: sat-builder-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOCKER_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_NAMESPACE }}/sat-builder:latest
            ${{ env.DOCKER_NAMESPACE }}/sat-builder:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.0.3
        env:
          PRO_SUDO: ${{ secrets.PRO_SUDO }}
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.PRO_SERVER }}
          username: ${{ secrets.PRO_USER }}
          key: ${{ secrets.PRO_KEY }}
          envs: PRO_SUDO,DEPLOY_SHA
          script: |
            set -e

            if [ "${PRO_SUDO}" = "true" ] || [ "${PRO_SUDO}" = "1" ]; then
              SUDO="sudo -n"
            else
              SUDO=""
            fi

            DEPLOY_DIR=/opt/sat-builder
            mkdir -p "$DEPLOY_DIR"
            TMP_COMPOSE="$(mktemp)"
            trap 'rm -f "$TMP_COMPOSE"' EXIT
            curl -fsSL \
              "https://raw.githubusercontent.com/Swarmchestrate/sat-builder/${DEPLOY_SHA}/docker-compose.yaml" \
              -o "$TMP_COMPOSE"
            $SUDO install -m 644 "$TMP_COMPOSE" "$DEPLOY_DIR/docker-compose.yaml"

            cd "$DEPLOY_DIR"

            export SAT_BUILDER_VERSION="$DEPLOY_SHA"
            $SUDO docker compose pull
            $SUDO docker compose up -d --remove-orphans --wait

            IMAGE_REPO="$($SUDO docker compose config --images | head -n 1)"
            IMAGE_REPO="${IMAGE_REPO%:*}"
            KEEP_IMAGES=5
            $SUDO docker image rm "$IMAGE_REPO:latest" >/dev/null 2>&1 || true
            $SUDO docker image ls "$IMAGE_REPO" \
              --format '{{.ID}}\t{{.CreatedAt}}\t{{.Tag}}' | \
              awk -F '\t' '$3 != "latest"' | \
              sort -k2,3r | tail -n +$((KEEP_IMAGES + 1)) | \
              cut -f1 | sort -u | \
              xargs -r -n1 $SUDO docker image rm || true
            $SUDO docker ps --filter "name=sat-builder"
