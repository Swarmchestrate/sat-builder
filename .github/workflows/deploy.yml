name: Build and Deploy SAT Builder

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: sat-builder-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOCKER_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_NAMESPACE }}/sat-builder:latest
            ${{ env.DOCKER_NAMESPACE }}/sat-builder:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.0.3
        env:
          PRO_SUDO: ${{ secrets.PRO_SUDO }}
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.PRO_SERVER }}
          username: ${{ secrets.PRO_USER }}
          key: ${{ secrets.PRO_KEY }}
          envs: PRO_SUDO,DEPLOY_SHA
          script: |
            set -e

            if [ "${PRO_SUDO}" = "true" ] || [ "${PRO_SUDO}" = "1" ]; then
              SUDO="sudo -n"
            else
              SUDO=""
            fi

            DEPLOY_DIR=/opt/sat-builder
            mkdir -p "$DEPLOY_DIR"
            TMP_COMPOSE="$(mktemp)"
            trap 'rm -f "$TMP_COMPOSE"' EXIT
            curl -fsSL \
              "https://raw.githubusercontent.com/Swarmchestrate/sat-builder/${DEPLOY_SHA}/docker-compose.yaml" \
              -o "$TMP_COMPOSE"
            $SUDO install -m 644 "$TMP_COMPOSE" "$DEPLOY_DIR/docker-compose.yaml"

            cd "$DEPLOY_DIR"

            $SUDO docker compose pull
            $SUDO docker compose up -d --remove-orphans
            $SUDO docker ps --filter "name=sat-builder"
